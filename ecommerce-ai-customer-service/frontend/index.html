<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电商智能客服 · AI Customer Service</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <div class="brand__logo">AI</div>
        <div class="brand__text">
          <h1 class="brand__title">电商智能客服</h1>
          <p class="brand__status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">连接中…</span>
          </p>
        </div>
      </div>
      <div class="topbar__actions">
        <button class="icon-btn" id="settingsBtn" title="设置后端地址" aria-label="设置">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
        <button class="icon-btn" id="clearBtn" title="清空对话" aria-label="清空对话">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6" />
            <path d="M10 11v6M14 11v6" />
          </svg>
        </button>
      </div>
    </header>

    <!-- 设置面板 -->
    <section class="settings" id="settings" hidden>
      <label class="settings__label" for="apiBase">后端地址</label>
      <input class="settings__input" id="apiBase" type="text" placeholder="http://127.0.0.1:8000" />
      <p class="settings__hint">
        由后端（<code>/ui</code>）打开本页面时可留空；直接双击打开 HTML 文件时请填写后端地址。
      </p>
      <label class="settings__check">
        <input type="checkbox" id="streamToggle" checked />
        <span>启用流式响应（SSE，逐字输出）</span>
      </label>
      <label class="settings__check">
        <input type="checkbox" id="asrToggle" checked />
        <span>显示 🎙️ 录音按钮（浏览器需授予麦克风权限）</span>
      </label>
      <label class="settings__check">
        <input type="checkbox" id="asrAutoSend" />
        <span>录音结束后自动发送（关闭则只回填到输入框）</span>
      </label>
    </section>

    <!-- 消息区 -->
    <main class="chat" id="chat"></main>

    <!-- 快捷提问 -->
    <div class="suggest" id="suggest"></div>

    <!-- 输入区 -->
    <form class="composer" id="composer">
      <textarea
        id="input"
        class="composer__input"
        rows="1"
        placeholder="输入你的问题，Enter 发送 / Shift + Enter 换行"
      ></textarea>
      <button
        type="button"
        class="composer__mic"
        id="micBtn"
        title="录音 / 停止"
        aria-label="语音输入"
        hidden
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="3" width="6" height="12" rx="3" />
          <path d="M5 11a7 7 0 0 0 14 0" />
          <path d="M12 18v3" />
        </svg>
      </button>
      <button type="submit" class="composer__send" id="sendBtn" title="发送" aria-label="发送">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13" />
          <path d="M22 2l-7 20-4-9-9-4 20-7z" />
        </svg>
      </button>
    </form>
  </div>

  <!-- Markdown 渲染：marked.js（CDN，离线场景下退化由前端 catch 兜底） -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>

  <script src="app.js" defer></script>
</body>
</html>
