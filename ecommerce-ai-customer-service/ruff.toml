target-version = "py312"
line-length = 100

[lint]
# 关键检查（不强制全套 E/W）
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # 行长度（README/字符串可能很长）
    "B008",  # 函数调用中的默认参数（如 Field(default=[])）— FastAPI 风格允许
]

[lint.per-file-ignores]
"tests/*" = ["B011"]  # 允许 asserts
"frontend/*" = ["ALL"]  # 前端 JS 不归 ruff 管